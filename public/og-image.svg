<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Yampi Dev Roadmap</title>
  <desc id="desc">De soporte IT a producto web, automatizacion y LLM workflows</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="55%" stop-color="#0d1520"/>
      <stop offset="100%" stop-color="#101c26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="180" cy="80" r="180" fill="#22d3ee" opacity="0.08"/>
  <circle cx="1110" cy="30" r="220" fill="#3b82f6" opacity="0.08"/>

  <rect x="64" y="58" width="200" height="6" rx="3" fill="url(#accent)"/>

  <text x="64" y="205" fill="#f3f4f6" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="74" font-weight="700" letter-spacing="-1">
    Yampi Dev Roadmap
  </text>

  <text x="64" y="265" fill="#cbd5e1" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="32" font-weight="500">
    De soporte IT a producto web, automatizacion y LLM workflows
  </text>

  <g transform="translate(64 350)">
    <rect x="0" y="0" width="112" height="42" rx="21" fill="#0f1724" stroke="#334155"/>
    <text x="56" y="27" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="20">React</text>

    <rect x="128" y="0" width="104" height="42" rx="21" fill="#0f1724" stroke="#334155"/>
    <text x="180" y="27" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="20">Astro</text>

    <rect x="248" y="0" width="120" height="42" rx="21" fill="#0f1724" stroke="#334155"/>
    <text x="308" y="27" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="20">Django</text>

    <rect x="384" y="0" width="156" height="42" rx="21" fill="#0f1724" stroke="#334155"/>
    <text x="462" y="27" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="20">WordPress</text>

    <rect x="556" y="0" width="92" height="42" rx="21" fill="#0f1724" stroke="#334155"/>
    <text x="602" y="27" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="20">n8n</text>

    <rect x="664" y="0" width="108" height="42" rx="21" fill="#0f1724" stroke="#334155"/>
    <text x="718" y="27" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="20">Codex</text>

    <rect x="788" y="0" width="142" height="42" rx="21" fill="#0f1724" stroke="#334155"/>
    <text x="859" y="27" text-anchor="middle" fill="#e2e8f0" font-family="'Plus Jakarta Sans','Segoe UI',sans-serif" font-size="20">Gemini CLI</text>
  </g>

  <rect x="64" y="462" width="1072" height="2" fill="#1e293b"/>
  <text x="64" y="520" fill="#94a3b8" font-family="'IBM Plex Mono','Consolas',monospace" font-size="20" filter="url(#glow)">
    roadmap de aprendizaje tecnico: frontend, backend, QA, automatizacion y LLM workflows
  </text>
</svg>
